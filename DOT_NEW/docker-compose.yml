services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kish
      POSTGRES_USER: kish
      POSTGRES_PASSWORD: kish_development_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kish -d kish"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kish:kish_development_only@postgres:5432/kish
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: change-this-development-secret-to-a-long-value
      SMS_WEBHOOK_SECRET: local-webhook-secret
      SIMULATION_MODE: "true"
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    image: node:24-alpine
    working_dir: /app
    volumes: [.:/app]
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
